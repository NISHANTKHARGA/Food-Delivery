name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [Frontend, Admin]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.app }}
        run: npm run lint

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build

  backend:
    name: Verify Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        working-directory: Backend
        run: npm ci

      - name: Syntax check
        working-directory: Backend
        run: node --check server.js

  deploy:
    name: Deploy to EC2
    needs: [verify, backend]
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER || 'ec2-user' }}
      SITE_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Frontend/package-lock.json
            Admin/package-lock.json

      - name: Check configuration
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          missing=0
          for name in EC2_HOST EC2_SSH_KEY MONGODB_URI JWT_SECRET STRIPE_SECRET_KEY ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub configuration: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "See DEPLOYMENT.md for the full list of repository variables and secrets."
            exit 1
          fi

      - name: Resolve public origin
        run: echo "SITE_ORIGIN=${SITE_ORIGIN:-http://$EC2_HOST}" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build frontend
        working-directory: Frontend
        run: VITE_API_URL="$SITE_ORIGIN" npm run build

      - name: Install admin dependencies
        working-directory: Admin
        run: npm ci

      - name: Build admin (served from /admin/)
        working-directory: Admin
        run: VITE_API_URL="$SITE_ORIGIN" npm run build -- --base=/admin/

      - name: Assemble release
        run: |
          mkdir -p release/frontend release/admin
          rsync -a --exclude node_modules --exclude /uploads --exclude /.env Backend/ release/Backend/
          cp -a Frontend/dist/. release/frontend/
          cp -a Admin/dist/. release/admin/
          cp -a deploy release/deploy

      - name: Write production environment
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          umask 077
          {
            echo "NODE_ENV=production"
            echo "PORT=4000"
            echo "TRUST_PROXY=true"
            echo "FRONTEND_URL=\"$SITE_ORIGIN\""
            echo "CORS_ORIGINS=\"$SITE_ORIGIN\""
            echo "MONGODB_URI=\"$MONGODB_URI\""
            echo "JWT_SECRET=\"$JWT_SECRET\""
            echo "JWT_EXPIRES_IN=\"7d\""
            echo "STRIPE_SECRET_KEY=\"$STRIPE_SECRET_KEY\""
            echo "ADMIN_EMAIL=\"$ADMIN_EMAIL\""
            echo "ADMIN_PASSWORD=\"$ADMIN_PASSWORD\""
            echo "ADMIN_JWT_EXPIRES_IN=\"12h\""
          } > release.env

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload release
        run: |
          RELEASE="${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}"
          echo "RELEASE_ID=$RELEASE" >> "$GITHUB_ENV"
          rsync -az --delete -e "ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            release/ "$EC2_USER@$EC2_HOST:/tmp/bitezy-$RELEASE/"
          scp -i "$HOME/.ssh/deploy_key" release.env \
            "$EC2_USER@$EC2_HOST:/tmp/bitezy-$RELEASE.env"

      - name: Run remote deployment
        run: |
          ssh -i "$HOME/.ssh/deploy_key" "$EC2_USER@$EC2_HOST" \
            "sudo bash /tmp/bitezy-$RELEASE_ID/deploy/deploy.sh '$RELEASE_ID' && sudo rm -rf /tmp/bitezy-$RELEASE_ID"

      - name: Smoke test
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS --max-time 5 "http://$EC2_HOST/healthz"; then
              echo
              echo "Smoke test passed."
              exit 0
            fi
            sleep 3
          done
          echo "::error::The deployed site did not respond on http://$EC2_HOST/healthz"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Bitezy deployment"
            echo ""
            echo "- Storefront: http://$EC2_HOST/"
            echo "- Admin panel: http://$EC2_HOST/admin/"
            echo "- Release: \`$RELEASE_ID\`"
            echo "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
