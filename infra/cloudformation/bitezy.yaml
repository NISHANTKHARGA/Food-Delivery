AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Bitezy food delivery platform - single Amazon Linux 2023 EC2 instance running
  Nginx (storefront at /, admin panel at /admin/, reverse proxy) and the Node.js
  API, with an Elastic IP and SSH access for GitHub Actions deployments.

Parameters:
  ProjectName:
    Type: String
    Default: bitezy
    AllowedPattern: "^[a-z][a-z0-9-]{2,19}$"
    Description: Lowercase project name used to prefix resources.

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
      - t3a.micro
      - t3a.small
    Description: EC2 instance size. t3.micro (1 GB) is fine because builds run on GitHub.

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair used for SSH. Create one in the EC2 console first and download the .pem file.

  AllowedSshCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}/[0-9]{1,2}$"
    Description: >-
      CIDR allowed to reach SSH. GitHub-hosted runners use dynamic IPs, so
      0.0.0.0/0 is the practical default; authentication is key-only.
      Narrow this if you deploy from a fixed IP.

Resources:
  # -------------------------------------------------------------------------
  # Networking
  # -------------------------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-vpc"

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-public-subnet"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-igw"

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-route-table"

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Bitezy HTTP, HTTPS and SSH traffic
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSshCidr
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-sg"

  # -------------------------------------------------------------------------
  # EC2 instance
  # -------------------------------------------------------------------------
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref SecurityGroup
      KeyName: !Ref KeyName
      Monitoring: false
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-app"
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee -a /var/log/bitezy-bootstrap.log) 2>&1

          echo "=== Bitezy bootstrap started ==="

          dnf -y update
          dnf -y install nginx tar rsync gzip curl

          # Node.js 22 (Amazon Linux 2023 package, NodeSource as fallback)
          if ! command -v node >/dev/null 2>&1; then
            dnf -y install nodejs22 || true
          fi
          if ! command -v node >/dev/null 2>&1; then
            curl -fsSL https://rpm.nodesource.com/setup_22.x | bash -
            dnf -y install nodejs
          fi
          if ! command -v npm >/dev/null 2>&1; then
            dnf -y install npm || true
          fi

          id -u bitezy >/dev/null 2>&1 || useradd --system --home-dir /opt/bitezy --shell /sbin/nologin bitezy
          mkdir -p /opt/bitezy/releases /opt/bitezy/shared/uploads /var/www/bitezy/frontend /var/www/bitezy/admin
          chown -R bitezy:bitezy /opt/bitezy
          chmod 755 /var/www/bitezy

          # 2 GB swap keeps npm installs comfortable on small instances
          if [ ! -f /swapfile ]; then
            (fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048) >/dev/null 2>&1 || true
            chmod 600 /swapfile
            mkswap /swapfile >/dev/null
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi

          cat > /var/www/bitezy/frontend/index.html <<'PLACEHOLDER'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Bitezy</title>
              <style>
                body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #fff8f5; color: #333; }
                h1 { margin: 0 0 8px; }
                p { margin: 0; color: #777; }
              </style>
            </head>
            <body>
              <div>
                <h1>Bitezy</h1>
                <p>The first deployment is on its way.</p>
              </div>
            </body>
          </html>
          PLACEHOLDER
          cp /var/www/bitezy/frontend/index.html /var/www/bitezy/admin/index.html

          # -----------------------------------------------------------------
          # systemd service (code arrives on the first deployment)
          # -----------------------------------------------------------------
          cat > /etc/systemd/system/bitezy-api.service <<'UNIT'
          [Unit]
          Description=Bitezy API (Node.js)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=bitezy
          Group=bitezy
          WorkingDirectory=/opt/bitezy/current/Backend
          EnvironmentFile=/opt/bitezy/shared/.env
          ExecStart=/usr/bin/node server.js
          Restart=always
          RestartSec=5
          TimeoutStopSec=20
          KillSignal=SIGINT
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=full
          ProtectHome=true

          [Install]
          WantedBy=multi-user.target
          UNIT

          # -----------------------------------------------------------------
          # Nginx: storefront at /, admin at /admin/, API at /api and /images
          # -----------------------------------------------------------------
          cat > /etc/nginx/nginx.conf <<'NGINXCONF'
          user nginx;
          worker_processes auto;
          error_log /var/log/nginx/error.log notice;
          pid /run/nginx.pid;

          events {
              worker_connections 1024;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;

              log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                              '$status $body_bytes_sent "$http_referer" '
                              '"$http_user_agent" "$http_x_forwarded_for"';
              access_log /var/log/nginx/access.log main;

              sendfile on;
              keepalive_timeout 65;
              server_tokens off;
              client_max_body_size 6m;

              gzip on;
              gzip_min_length 1024;
              gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

              upstream bitezy_api {
                  server 127.0.0.1:4000;
                  keepalive 16;
              }

              server {
                  listen 80 default_server;
                  server_name _;

                  root /var/www/bitezy/frontend;
                  index index.html;

                  location = /healthz {
                      proxy_pass http://bitezy_api/;
                      proxy_set_header Host $host;
                  }

                  location /api/ {
                      proxy_pass http://bitezy_api;
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                      proxy_read_timeout 60s;
                  }

                  location /images/ {
                      proxy_pass http://bitezy_api;
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                      expires 1d;
                      add_header Cache-Control "public";
                  }

                  location = /admin {
                      return 301 /admin/;
                  }

                  location /admin/assets/ {
                      root /var/www/bitezy;
                      try_files $uri =404;
                      expires 1y;
                      add_header Cache-Control "public, immutable";
                  }

                  location /admin/ {
                      root /var/www/bitezy;
                      try_files $uri $uri/ /admin/index.html;
                      add_header Cache-Control "no-cache";
                  }

                  location /assets/ {
                      try_files $uri =404;
                      expires 1y;
                      add_header Cache-Control "public, immutable";
                  }

                  location / {
                      try_files $uri $uri/ /index.html;
                  }
              }
          }
          NGINXCONF

          systemctl daemon-reload
          systemctl enable nginx bitezy-api
          systemctl restart nginx || true

          echo "=== Bitezy bootstrap complete ==="

  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance

Outputs:
  WebsiteUrl:
    Description: Public storefront URL
    Value: !Sub "http://${ElasticIP}"

  AdminUrl:
    Description: Admin panel URL
    Value: !Sub "http://${ElasticIP}/admin/"

  PublicIp:
    Description: Elastic IP address. Use it for the EC2_HOST GitHub variable.
    Value: !Ref ElasticIP

  InstanceId:
    Description: EC2 instance id
    Value: !Ref Instance

  SshCommand:
    Description: SSH command (replace the key path)
    Value: !Sub "ssh -i bitezy-key.pem ec2-user@${ElasticIP}"
